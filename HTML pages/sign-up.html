<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up for Lolia's shopping site</title>
    <link rel="stylesheet" href="../CSS pages/sign-up.css">
</head>
<body>
    <header>
        <div class="up-text">
            <h3>Sign up for Lolia's Shopping Site</h3>
        </div>
        <div>
            <a href="home.html" class="home-link">Home</a>
            <span class="arrow"> > </span>
            <a href="sign-up.html" class="sign-up-link">Sign Up</a>
        </div>
    </header>
    <main class="main">
        <div class="form" id="signup-form">
            <h1 class="sign-up-text">Sign up</h1>
            <p class="required-text">* indicates required fields</p>

            <h3 class="first-name-text">First Name*: </h3>
            <input type="text" placeholder="John" class="first-name-input">
            <h3>Middle Name: </h3>
            <input type="text" placeholder="Middle name" class="middle-name-input">
            <h3>Last Name*: </h3>
            <input type="text" placeholder="Doe" class="last-name-input">
            <h3>Email*: </h3>
            <input type="text" placeholder="Email address" class="email-input">
            <h3>Phone Number*: </h3>
            <input type="text" placeholder="Enter your phone number" class="number-input">
            <h3>Address Line 1*: </h3>
            <input type="text" placeholder="Street number" class="street-input">
            <h3>Adress Line 2: </h3>
            <input type="text" placeholder="P.O. Box, e.t.c" class="box-input">
            <h3>City*: </h3>
            <input type="text" placeholder="City" class="city-input">
            <h3>State*: </h3>
            <input type="text" placeholder="State" class="state-input">
            <h3>Country*: </h3>
            <input type="text" placeholder="Country" class="country-input">
            <h3>Zip Code*: </h3>
            <input type="text" placeholder="Zip Code" class="zip-input">
        </div>
        <div class="error"></div>
        <div class="after-error"></div>
        <div>
            <a href="submit.html" class="submit">Submit</a>
        </div>
        <div class="bottom-div">
            <img src="../Images/versace-logo-1.svg" alt="" class="versace">
            <img src="../Images/zara-full-corporate.jpg" alt="" class="zara">
            <img src="../Images/gucci-logo-1.svg" alt="" class="gucci">
            <img src="../Images/prada-logo-1.svg" alt="" class="prada">
            <img src="../Images/calvin-klein-1.svg" alt="" class="calvin-klein">
        </div>
    </main>
    <script src="../JavaScript Pages/sign-up.js"></script>
</body>
</html>
